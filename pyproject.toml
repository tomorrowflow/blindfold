[project]
name = "blindfold"
version = "0.1.0"
description = "Blindfold — reversible LLM-anonymization proxy (blindfold/restore)."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "cryptography>=42.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    # ADR-0003 (issue #317): L1's pattern layer -- checksum/check-digit-backed
    # PatternRecognizers only (IBAN, credit card, the four validated German ID
    # recognizers), never presidio's optional NER recognizers. L1 is always-on
    # deterministic protection, so this is a base dependency, not an extra like
    # `gliner`. Exact-pinned per the issue's own instruction: presidio-analyzer
    # transitioned from Microsoft to the community data-privacy-stack org in
    # 2026, so it's treated as a pinned utility library, not a rolling platform.
    "presidio-analyzer==2.2.364",
    "psycopg[binary]>=3.1",
    "unidecode>=1.4.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# ADR-0034 §6: the GLiNER cascade's local NER model + ONNX runtime are opt-in
# weight (~197 MB), never a base dependency. Install with `blindfold[gliner]`.
# huggingface_hub ships transitively via gliner's own deps too, but this module
# (gliner_provisioning.py) imports it directly (ADR-0034 §4), so it's pinned
# explicitly rather than relied on implicitly.
gliner = [
    "gliner>=0.2.13",
    "onnxruntime>=1.19",
    "huggingface_hub>=0.35",
]

[project.scripts]
blindfold = "blindfold.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "testcontainers>=4.14.2",
    "playwright>=1.61.0",
]
# ADR-0039: freezing the proxy into a self-contained binary (the ".app ⊃
# frozen-proxy ⊃ ui_dist" layering) is a dev/CI-time release step, never a
# runtime dependency of `blindfold serve` — kept out of `dev` so an ordinary
# test run never needs it installed.
#
# Deliberately never co-installed with `devtools` in CI — `uv sync --group freeze`
# resolves `dev + freeze` only (there is no `[tool.uv] default-groups` pulling `devtools`
# in). This matters because `devtools`' own runtime dependency `rich` IS reachable from
# the product's own import graph (pydantic's lazy `from rich.pretty import pprint` —
# packaging/blindfold-proxy.spec's excludes comment), so a `freeze` + `devtools`
# co-install genuinely bundles rich into the release binary — freezing would then
# correctly fail. packaging/freeze_env_check.py asserts this precondition (rich not
# importable) in the freeze job before PyInstaller runs, so a developer who runs `uv sync
# --all-groups` (or `--group devtools`) and then freezes meets a named cause there
# instead of an unexplained one buried in PyInstaller's own bundling (issue #272).
freeze = [
    "pyinstaller==6.21.0",
]
# ADR-0047 §2: blindfold_devtools' own runtime deps (rich, for the Diagnostic session's
# `captures`/`explain` rendering). Deliberately its own group, not `dev` and not `freeze` —
# it is a source-run-only capability, not a test-suite or freeze-time dependency, and it
# must never reach the wheel or the frozen binary (see [tool.hatch.build.targets.wheel]
# below, packaging/blindfold-proxy.spec's excludes comment, and the `freeze` group comment
# above for how that's actually guaranteed — issue #272).
devtools = [
    "rich>=13.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blindfold"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "full_pupa_corpus: opt-in full-PUPA-corpus leak-audit run (issue #77); set BLINDFOLD_FULL_PUPA_CORPUS=1 or select with -m",
]
